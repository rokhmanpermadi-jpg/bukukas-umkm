name: Bangun APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Siapkan keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore $RUNNER_TEMP/release.jks -alias bukukas -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bukukas123 -keypass bukukas123 -dname "CN=Buku Kas UMKM, OU=KWT Mawar, O=Pengabdian, L=Kotawaringin Timur, C=ID"
            echo "KEYSTORE_PASS=bukukas123" >> $GITHUB_ENV
            echo "KEY_ALIAS=bukukas" >> $GITHUB_ENV
            echo "KEY_PASS=bukukas123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Bangun APK rilis
        run: gradle --no-daemon assembleRelease
      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk BukuKasUMKM.apk
      - uses: actions/upload-artifact@v4
        with: { name: BukuKasUMKM-apk, path: BukuKasUMKM.apk }
      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Buku Kas UMKM build ${{ github.run_number }}
          files: BukuKasUMKM.apk
          body: "APK Buku Kas UMKM. Unduh BukuKasUMKM.apk, buka di HP Android, izinkan pemasangan dari sumber tidak dikenal bila diminta."
